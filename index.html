<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Canvas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
height:100%;
overflow:hidden;
font-family:Inter,sans-serif;
background:#09090f;
color:white;
}

body{
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

/* Animated Background */

.bg{
position:absolute;
inset:-20%;
background:

radial-gradient(circle at 20% 20%,#00b4ff55 0%,transparent 35%),
radial-gradient(circle at 80% 30%,#6a5cff55 0%,transparent 35%),
radial-gradient(circle at 40% 80%,#ff5ec955 0%,transparent 35%),
radial-gradient(circle at 70% 70%,#00ffc355 0%,transparent 35%),
#09090f;

filter:blur(80px);
animation:move 18s ease-in-out infinite alternate;
transition:.3s;
}

@keyframes move{

0%{
transform:translate(-5%,-3%) scale(1);
}

50%{
transform:translate(4%,2%) scale(1.12);
}

100%{
transform:translate(-3%,5%) scale(1.05);
}

}

/* Glass */

.card{

position:relative;
width:min(950px,92%);
padding:70px;

border-radius:32px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

box-shadow:

0 20px 80px rgba(0,0,0,.45),

0 0 0 1px rgba(255,255,255,.03);

animation:appear 1.4s ease;

z-index:10;

}

@keyframes appear{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:none;

}

}

.small{

letter-spacing:4px;
text-transform:uppercase;
font-size:12px;
opacity:.65;

}

h1{

margin-top:18px;

font-size:68px;

font-weight:800;

line-height:1;

max-width:700px;

}

.highlight{

background:linear-gradient(90deg,#65e0ff,#7c78ff,#ff7dd7);

-webkit-background-clip:text;

color:transparent;

}

p{

margin-top:28px;

font-size:20px;

max-width:620px;

line-height:1.8;

opacity:.82;

}

.bottom{

display:flex;

justify-content:space-between;

align-items:flex-end;

margin-top:80px;

flex-wrap:wrap;

gap:30px;

}

.time{

font-size:48px;

font-weight:700;

letter-spacing:2px;

}

.quote{

max-width:360px;

font-size:16px;

line-height:1.8;

opacity:.7;

transition:.6s;

}

.cursor{

position:absolute;

width:450px;

height:450px;

border-radius:50%;

pointer-events:none;

background:radial-gradient(circle,#ffffff22,transparent 70%);

mix-blend-mode:screen;

filter:blur(40px);

transform:translate(-50%,-50%);

transition:.18s;

}

@media(max-width:700px){

h1{
font-size:42px;
}

.time{
font-size:32px;
}

.card{
padding:40px;
}

}

</style>
</head>

<body>

<div class="bg"></div>
<div class="cursor"></div>

<div class="card">

<div class="small">
Some pages don't need noise.
</div>

<h1>
Design is the art of making
<span class="highlight">
silence visible.
</span>
</h1>

<p>
There is no dashboard here. No signup button. No product pitch.
Just a page that quietly exists, moving almost imperceptibly,
rewarding anyone who pauses for a moment.
</p>

<div class="bottom">

<div class="time" id="clock"></div>

<div class="quote" id="quote"></div>

</div>

</div>

<script>

const clock=document.getElementById("clock");

function updateClock(){

const d=new Date();

clock.innerHTML=d.toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit',
second:'2-digit'
});

}

setInterval(updateClock,1000);

updateClock();

const quotes=[

"Good design whispers.",
"Elegance is removing everything unnecessary.",
"The best interface disappears.",
"Beauty is usually quiet.",
"Not everything remarkable has to be loud.",
"Calm is a feature.",
"Minimalism isn't empty. It's intentional.",
"Every pixel should earn its place."

];

let i=0;

const q=document.getElementById("quote");

function changeQuote(){

q.style.opacity=0;

setTimeout(()=>{

i=(i+1)%quotes.length;

q.textContent=quotes[i];

q.style.opacity=.7;

},400);

}

q.textContent=quotes[0];

setInterval(changeQuote,4500);

const cursor=document.querySelector(".cursor");
const bg=document.querySelector(".bg");

window.addEventListener("mousemove",(e)=>{

cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";

const x=(e.clientX/window.innerWidth)*100;
const y=(e.clientY/window.innerHeight)*100;

bg.style.background=`
radial-gradient(circle at ${x}% ${y}%,#6be4ff55 0%,transparent 30%),
radial-gradient(circle at 20% 20%,#00b4ff55 0%,transparent 35%),
radial-gradient(circle at 80% 30%,#7a6bff55 0%,transparent 35%),
radial-gradient(circle at 40% 80%,#ff5ec955 0%,transparent 35%),
#09090f`;

});

</script>

</body>
</html>
